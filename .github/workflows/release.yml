name: Application release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable app release tag (for example v1.1.1-preview.1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm --prefix companion ci
      - run: npm run check
      - run: pwsh -NoProfile -File companion/scripts/test-action-engines.ps1
      - run: npm run package
      - name: Assemble and publish prerelease
        shell: pwsh
        run: |
          $build = Get-Content -LiteralPath companion/out/latest-build.json | ConvertFrom-Json
          npm --prefix companion run check:desktop -- "$($build.directory)"
          if ($LASTEXITCODE -ne 0) { throw "Desktop acceptance failed" }
          New-Item -ItemType Directory -Force -Path dist/app | Out-Null
          Compress-Archive -LiteralPath $build.directory -DestinationPath dist/app/StreamerCompanion-Windows-x64.zip
          $hash = (Get-FileHash -LiteralPath dist/app/StreamerCompanion-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath dist/app/SHA256SUMS -Value "$hash  StreamerCompanion-Windows-x64.zip"
          gh release create "$env:RELEASE_TAG" dist/app/StreamerCompanion-Windows-x64.zip dist/app/SHA256SUMS --target "$env:GITHUB_SHA" --prerelease --title "Streamer Companion $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
