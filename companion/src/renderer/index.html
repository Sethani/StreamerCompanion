<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streaming Companion</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><h1>Streaming Companion</h1><p>Your modules and streaming services.</p></div><div id="streamerbot" class="connection">Checking Streamer.bot</div></header>
<main><div class="toolbar"><nav role="tablist" aria-label="Companion"><button id="tab-installed" role="tab" aria-controls="panel-installed">Installed <span id="attention-count"></span></button><button id="tab-catalogue" role="tab" aria-controls="panel-catalogue">Catalogue <span id="update-count"></span></button><button id="tab-settings" role="tab" aria-controls="panel-settings">Settings</button></nav><button id="refresh" class="icon" title="Refresh module health" aria-label="Refresh module health">&#8635;</button></div>
<div id="feedback" role="status"></div>
<section id="panel-installed" role="tabpanel" aria-labelledby="tab-installed"><div class="section-heading"><h2>Installed</h2><details id="bulk"><summary>All services</summary><div class="bulk-menu"><p>Applies to all services, regardless of filters.</p><label><input id="autostart-all" type="checkbox"> Auto-start all</label><div class="actions"><button id="start-all">Start all</button><button id="stop-all" class="secondary">Stop all</button></div></div></details></div>
<div class="list-tools"><label>Search installed<input id="installed-search" type="search" placeholder="Name, description, category…"></label><button id="installed-clear" class="secondary">Clear search</button><label>Show<select id="installed-filter"><option value="all">All</option><option value="favorites">Favorites</option><option value="attention">Needs attention</option><option value="running">Running</option><option value="stopped">Stopped</option></select></label></div><p id="installed-count" role="status"></p><div id="modules" class="module-list"></div></section>
<section id="panel-catalogue" role="tabpanel" aria-labelledby="tab-catalogue" hidden><div class="section-heading"><h2>Catalogue</h2><div class="actions"><button id="install">Install module file…</button><button id="catalog-check">Check for updates</button></div></div><p id="catalog-status"></p><div class="list-tools"><label>Search catalogue<input id="catalogue-search" type="search" placeholder="Name, description, category…"></label><button id="catalogue-clear" class="secondary">Clear search</button><label>Show<select id="catalogue-filter"><option value="all">All</option><option value="favorites">Favorites</option><option value="updates">Updates</option><option value="not-installed">Not installed</option></select></label></div><p id="catalogue-count" role="status"></p><div id="catalog" class="module-list"></div></section>
<section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden><h2>Settings</h2><section class="api-section"><div><h3>Module API</h3><p id="api-status">Authenticated local module installation</p></div><div class="actions"><button id="copy-api-token" class="secondary">Copy API token</button><button id="rotate-api-token" class="secondary">Rotate token</button></div></section></section></main>
<script src="navigation.js"></script><script src="app.js"></script></body></html>
