<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoutout Clips</title><link rel="stylesheet" href="./styles.css?v=2"></head><body><main>
<header><div><h1>Shoutout Clips</h1><p id="status">Connecting</p></div><button id="health" type="button">Health</button></header>
<form id="form">
<section><div class="heading"><h2>Clip player</h2><button id="reset-player" type="button">Reset</button></div><div class="grid"><label>Player<select id="player"><option value="mustached">Mature-content compatible</option><option value="twitch">Twitch embed</option></select></label><label>Maximum duration (seconds)<input id="maximum" type="number" min="5" max="60"></label><label class="check"><input id="muted" type="checkbox"> Muted</label></div></section>
<section><div class="heading"><h2>Position and size</h2><button id="reset-layout" type="button">Reset</button></div><div class="grid four"><label>X (pixels)<input id="x" type="number" min="0" max="3840"></label><label>Y (pixels)<input id="y" type="number" min="0" max="2160"></label><label>Width<input id="width" type="number" min="160" max="1920"></label><label>Height<input id="height" type="number" min="90" max="1080"></label></div></section>
<section><div class="heading"><h2>Title bar</h2><button id="reset-label" type="button">Reset</button></div><div class="grid four"><label>Text size<input id="font-size" type="number" min="12" max="64"></label><label>Text colour<input id="text-colour" type="color"></label><label>Background<input id="background" type="color"></label><label>Opacity (%)<input id="opacity" type="number" min="0" max="100"></label></div></section>
<section><div class="heading"><h2>Preview and save</h2><span id="dirty">Saved</span></div><div class="grid"><label>Twitch clip ID<input id="clip-id" placeholder="Clip slug or ID"></label><label>Channel label<input id="channel" placeholder="Test streamer"></label><label>Optional title<input id="title"></label><label>Preview seconds<input id="duration" type="number" min="1" max="60" value="15"></label></div><div class="actions"><button class="primary" type="submit">Save settings</button><button id="play" type="button">Play preview</button><button id="stop" type="button">Stop</button></div></section>
</form><p id="feedback" role="status"></p></main><script src="../../universal-dock/shared/streamerbot-transport.js"></script><script src="./app.js?v=2"></script></body></html>
