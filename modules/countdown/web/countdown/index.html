<!doctype html><html><head><meta charset="utf-8"><title>Countdown</title><link rel="stylesheet" href="../../universal-dock/shared/styles.css"></head><body><main><h1>Countdown</h1><p id="connection" role="status">Connecting to Streamer.bot…</p><p>Controls the timer in your combined OBS overlay. Use your usual stream-launch controls to go live.</p><form id="timer-form"><section><label>Hours <input id="hours" type="number" min="0" value="0"></label><label>Minutes <input id="minutes" type="number" min="0" max="59" value="5"></label><label>Seconds <input id="seconds" type="number" min="0" max="59" value="0"></label><label>Finished text<textarea id="finished-text" maxlength="500">Starting
soon</textarea></label><button id="initialize" type="button">Load saved state</button><button id="save" type="button">Save preset</button><button id="start" type="submit">Start countdown</button><button id="pause" type="button">Pause</button><button id="resume" type="button">Resume</button><button id="clear" type="button">Clear</button></section></form><section><h2 id="status">Idle</h2><output id="remaining">00:00</output></section><p id="feedback" role="status"></p><p>No new OBS source is needed. Source Modules controls scene visibility.</p></main><script src="../../universal-dock/shared/streamerbot-transport.js"></script><script src="app.js"></script></body></html>
