<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Player</title><link rel="stylesheet" href="./styles.css?v=2"></head><body><main>
<header><div><h1>Video Player</h1><p id="status">Connecting</p></div><div><button id="export" type="button">Export</button><button id="import" type="button">Import</button><input id="import-file" type="file" accept="application/json" hidden></div></header>
<section><div class="heading"><h2>Registered videos</h2><span id="count">0</span></div><button id="refresh-media" type="button">Refresh media</button><div id="library" class="library"></div><p class="hint">Use Add media in Companion, then refresh here to register your files. Existing library paths remain supported.</p></section>
<form id="form">
<section><div class="heading"><h2>Position and size</h2><button id="reset-position" type="button">Reset</button></div><div class="grid four"><label>Anchor<select id="anchor"><option value="top-left">Top left</option><option value="top">Top</option><option value="top-right">Top right</option><option value="left">Left</option><option value="center">Centre</option><option value="right">Right</option><option value="bottom-left">Bottom left</option><option value="bottom">Bottom</option><option value="bottom-right">Bottom right</option></select></label><label>X offset (%)<input id="x" type="number" min="-50" max="50" step="0.5"></label><label>Y offset (%)<input id="y" type="number" min="-50" max="50" step="0.5"></label><label>Width (%)<input id="width" type="number" min="10" max="100" step="1"></label><label>Aspect ratio<select id="aspect"><option value="16:9">16:9</option><option value="4:3">4:3</option><option value="1:1">Square</option><option value="source">Source</option></select></label><label>Video fit<select id="fit"><option value="contain">Contain</option><option value="cover">Cover</option><option value="fill">Stretch</option></select></label><label>Volume (%)<input id="volume" type="number" min="0" max="100" step="1"></label></div></section>
<section><div class="heading"><h2>Title bar</h2><button id="reset-title" type="button">Reset</button></div><div class="grid four"><label>Position<select id="title-position"><option value="bottom">Bottom</option><option value="top">Top</option></select></label><label>Text size<input id="title-size" type="number" min="12" max="72"></label><label>Text colour<input id="title-colour" type="color"></label><label>Background<input id="title-background" type="color"></label><label>Background opacity (%)<input id="title-opacity" type="number" min="0" max="100"></label></div></section>
<section><div class="heading"><h2>Preview and save</h2><span id="dirty">Saved</span></div><div class="preview"><label>Video<select id="preview-video"></select></label><label>Optional title<input id="preview-title" maxlength="140" placeholder="No title bar when empty"></label><button class="primary" type="submit">Save settings</button><button id="play" type="button">Play preview</button><button id="stop" type="button">Stop</button></div></section>
</form><p id="feedback" role="status"></p></main><script src="../../universal-dock/shared/streamerbot-transport.js"></script><script src="./app.js?v=2"></script></body></html>
