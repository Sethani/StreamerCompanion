<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokemon Encounters Overlay</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Segoe UI",sans-serif}.layer{--width:320px;--opacity:.88;position:absolute;width:var(--width)}.idle{display:none}.top-left{left:28px;top:28px}.top-right{right:28px;top:28px}.bottom-left{left:28px;bottom:28px}.bottom-right{right:28px;bottom:28px}.card{position:relative;display:grid;grid-template-columns:minmax(86px,34%) 1fr;align-items:center;gap:12px;padding:10px 12px;border:2px solid rgba(90,214,126,.9);border-radius:8px;background:rgba(18,22,24,var(--opacity));box-shadow:0 8px 24px rgba(0,0,0,.4)}.visual{display:grid;justify-items:center;gap:3px;min-width:0}.art-stage{position:relative;width:94%;aspect-ratio:1}#art,.mystery-art{position:absolute;inset:0;width:100%;height:100%}#art{object-fit:contain}.mystery-art{display:none;place-items:center;border-radius:50%;background:radial-gradient(circle at 38% 30%,#394047 0 18%,#171b1f 55%,#090b0d 100%);color:#c9d0d4;font-size:58px;font-weight:800;text-shadow:0 3px 0 #000;box-shadow:inset 0 0 0 4px rgba(255,255,255,.08),0 5px 12px rgba(0,0,0,.45)}.copy{display:grid;gap:2px;min-width:0}.copy span{color:#d9e4e1;font-size:18px}.copy strong{color:#ffe36f;font-size:24px;line-height:1.08;overflow-wrap:anywhere}.types{display:flex;align-items:center;justify-content:center;gap:3px;min-height:20px}.types:empty{display:none}.types img{width:20px;height:20px;object-fit:contain}.copy small{margin-top:7px;color:#94e2b1;font-size:13px;line-height:1.3}.throw-stage{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:visible}.thrower{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:1px;will-change:transform,opacity}.thrown-ball{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.65))}.throw-name{max-width:100px;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#art[src=""]{visibility:hidden}#art[src=""]+.mystery-art{display:grid}
</style></head><body><section id="layer" class="layer idle"><div id="card" class="card"><div class="visual"><div class="art-stage"><img id="art" alt=""><div class="mystery-art" aria-hidden="true">?</div></div><div id="types" class="types"></div></div><div class="copy"><strong id="name"></strong><span>appears!</span><small id="timer"></small></div><div id="throw-stage" class="throw-stage"></div></div></section><script>
const layer=document.getElementById("layer"),card=document.getElementById("card"),stage=document.getElementById("throw-stage"),art=document.getElementById("art"),name=document.getElementById("name"),types=document.getElementById("types"),timer=document.getElementById("timer");let active="",playing=false,currentSettings={};const seen=new Set(),queue=[];function remaining(ms){const total=Math.max(0,Math.ceil(Number(ms)/1000));return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0")}async function playNext(){if(playing||!queue.length||!active)return;playing=true;const thrown=queue.shift(),thrower=document.createElement("div"),ball=document.createElement("img"),label=document.createElement("span");thrower.className="thrower";ball.className="thrown-ball";ball.alt=(thrown.ball||"poke-ball").replaceAll("-"," ");ball.src="/pokemon/ball/"+encodeURIComponent(thrown.ball||"poke-ball")+".png?v=1";label.className="throw-name";label.textContent=thrown.user||"viewer";label.hidden=currentSettings.showThrowNames===false;thrower.append(ball,label);stage.append(thrower);await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const box=stage.getBoundingClientRect(),target=art.getBoundingClientRect(),startX=box.width+26,startY=box.height+20,hitX=target.left-box.left+target.width*.58-21,hitY=target.top-box.top+target.height*.48-21;const animation=thrower.animate([{transform:`translate(${startX}px,${startY}px) rotate(0deg)`,opacity:0},{offset:.12,opacity:1},{offset:.66,transform:`translate(${hitX}px,${hitY}px) rotate(-620deg)`,opacity:1},{offset:.76,transform:`translate(${hitX+10}px,${hitY-9}px) rotate(-700deg)`},{offset:.84,transform:`translate(${hitX-5}px,${hitY+7}px) rotate(-760deg)`},{transform:`translate(${hitX-72}px,${hitY+86}px) rotate(-1040deg)`,opacity:0}],{duration:Math.max(500,Math.min(2500,Number(currentSettings.throwSpeedMs)||1100)),easing:"cubic-bezier(.2,.72,.25,1)",fill:"forwards"});await animation.finished.catch(()=>{});thrower.remove();playing=false;setTimeout(playNext,90)}function collectThrows(state,encounter){const limit=Math.max(1,Math.min(30,Number(currentSettings.throwQueueLimit)||10));for(const thrown of state.throws||[]){if(!thrown?.id||seen.has(thrown.id)||thrown.encounterId!==encounter.id)continue;seen.add(thrown.id);if(Date.now()-Number(thrown.atMs)<5000&&queue.length<limit)queue.push(thrown)}playNext()}function render(state){const encounter=state?.enabled?state.encounter:null;if(!encounter){layer.className="layer idle";active="";art.removeAttribute("src");types.replaceChildren();queue.length=0;stage.replaceChildren();playing=false;return}if(active&&active!==encounter.id){seen.clear();queue.length=0;stage.replaceChildren();playing=false}const settings=state.config||{};currentSettings=settings;layer.className="layer "+(settings.position||"bottom-right");layer.style.setProperty("--width",Math.max(160,Math.min(800,Number(settings.width)||320))+"px");layer.style.setProperty("--opacity",Math.max(.1,Math.min(1,(Number(settings.opacity)||88)/100)));name.textContent=encounter.name||"Pokemon";types.replaceChildren(...(encounter.types||[]).map(type=>{const image=document.createElement("img");image.src="/pokemon/type/"+encodeURIComponent(type.id)+".png?v=swsh-symbol-1";image.alt=type.name||"Pokemon type";image.title=type.name||"";return image}));timer.hidden=settings.showTimer===false;timer.textContent="Catch it with !pokecatch · "+remaining(Number(encounter.expiresAtMs)-Date.now());if(active!==encounter.id)art.src=encounter.imageUrl;active=encounter.id;collectThrows(state,encounter)}async function refresh(){try{const response=await fetch("/api/pokemon/state",{cache:"no-store"});if(!response.ok)throw new Error();render(await response.json())}catch{render(null)}setTimeout(refresh,300)}refresh();
</script></body></html>
