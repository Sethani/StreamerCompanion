<!doctype html><html><head><meta charset="utf-8"><title>Controller renderer</title><link rel="stylesheet" href="/overlay.css"></head><body><section id="controller-box" hidden>      <div id="controller-local" class="controller-local" aria-label="Controller input display">
        <div id="controller-disconnected" class="controller-disconnected">DISCONNECTED</div>
        <div class="controller-body">
          <div class="shoulder shoulder-left" data-button="4">LB</div><div class="shoulder shoulder-right" data-button="5">RB</div>

          <div class="dpad"><b data-button="12">▲</b><b data-button="14">◀</b><b data-button="15">▶</b><b data-button="13">▼</b></div>
          <div class="face-buttons"><b class="button-y" data-button="3">Y</b><b class="button-x" data-button="2">X</b><b class="button-b" data-button="1">B</b><b class="button-a" data-button="0">A</b></div>
          <b class="menu menu-back" data-button="8">◀</b><b class="menu menu-start" data-button="9">▶</b><b class="guide" data-button="16">●</b>
        </div>
      </div><span id="test-label" hidden>TEST</span></section><script src="/overlay.js"></script></body></html>
