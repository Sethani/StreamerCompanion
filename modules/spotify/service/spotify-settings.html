<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Music</title>
<style>:root{color-scheme:dark;font-family:"Segoe UI",sans-serif;background:#111517;color:#eef3f1}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:980px;margin:auto}h1{font-size:24px;margin:0 0 6px}p,small{color:#aebbb7}fieldset,.binding{border:1px solid #34413e;border-radius:6px;padding:16px;margin:16px 0;background:#181f21}label{display:grid;gap:6px;margin:10px 0;color:#d8e0de}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}input,select{width:100%;border:1px solid #657370;border-radius:4px;background:#111719;color:#fff;padding:9px;font:inherit}.grid{display:grid;grid-template-columns:2fr 2fr repeat(3,1fr) 1.2fr auto;gap:10px;align-items:end}.base-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid #39b6aa;border-radius:5px;padding:10px 16px;background:#147a73;color:white;font:inherit;font-weight:600;cursor:pointer}.secondary{background:#26312f;border-color:#657370}.danger{background:#512623;border-color:#a85a52}.binding button{margin-bottom:10px}#feedback{min-height:24px;margin-top:12px;color:#9fe3dc}.error{color:#ffaaa4!important}@media(max-width:850px){.grid,.base-grid{grid-template-columns:1fr 1fr}.grid label:first-child,.grid label:nth-child(2){grid-column:span 2}}@media(max-width:520px){.grid,.base-grid{grid-template-columns:1fr}.grid label:first-child,.grid label:nth-child(2){grid-column:auto}}</style></head>
<body><main><h1>Spotify Music</h1><p>Configure Spotify playback, countdown fading, scene-owned music, and viewer chat commands.</p>
<fieldset><legend>Spotify account</legend><label>Client ID<input id="client-id" autocomplete="off"></label><label>Client secret<input id="client-secret" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved secret"></label><small>Spotify must allow this callback URL:</small><label>Callback URL<input id="redirect-uri" readonly></label><div class="actions"><button id="authorize" type="button" class="secondary">Authorize Spotify</button><button id="devices" type="button" class="secondary">Refresh devices</button></div><label>Playback device<select id="device"><option value="">Use the active device</option></select></label><small id="auth-state"></small></fieldset>
<fieldset><legend>Default playback</legend><label>Playlist URL, URI, or ID<input id="playlist" placeholder="https://open.spotify.com/playlist/..."></label><div class="base-grid"><label>Starting volume<input id="start-volume" type="number" min="0" max="100"></label><label>Normal volume<input id="normal-volume" type="number" min="0" max="100"></label><label>Fade duration in seconds<input id="fade-seconds" type="number" min="0" max="3600"></label></div></fieldset>
<fieldset><legend>Scene automation</legend><label class="check"><input id="enabled" type="checkbox"> Enable scene-owned music</label><div id="bindings"></div><button id="add" class="secondary">Add scene</button></fieldset>
<fieldset><legend>Viewer chat</legend><label class="check"><input id="song-command" type="checkbox"> Enable !song</label><label class="check"><input id="playlist-command" type="checkbox"> Enable !playlist</label><label class="check"><input id="now-playing" type="checkbox"> Announce each newly playing song</label><small>Messages are sent through Streamer.bot Chat Routing as the bot. Errors remain private.</small></fieldset>
<div class="actions"><button id="save">Save Spotify settings</button><button id="test-current" class="secondary">Read current song</button></div><div id="feedback" role="status"></div>
<template id="row"><div class="binding grid"><label>OBS scene<input data-key="scene" placeholder="Intermission: BRB"></label><label>Playlist<input data-key="playlist" placeholder="Default stream playlist"></label><label>Start volume<input data-key="startVolume" type="number" min="0" max="100"></label><label>Normal volume<input data-key="normalVolume" type="number" min="0" max="100"></label><label>Fade seconds<input data-key="fadeSeconds" type="number" min="0" max="3600"></label><label>On leaving<select data-key="leaveBehavior"><option value="pause">Pause if started here</option><option value="keep">Keep playing</option></select></label><button class="danger remove">Remove</button></div></template>
<script>
const $=id=>document.getElementById(id),feedback=(text,error=false)=>{$("feedback").textContent=text;$("feedback").className=error?"error":""};
function add(value={}){const node=$("row").content.firstElementChild.cloneNode(true);for(const input of node.querySelectorAll("[data-key]"))input.value=value[input.dataset.key]??"";node.querySelector(".remove").onclick=()=>node.remove();$("bindings").append(node)}
function rows(){return [...document.querySelectorAll(".binding")].map(row=>Object.fromEntries([...row.querySelectorAll("[data-key]")].map(input=>[input.dataset.key,input.value]))).filter(row=>row.scene.trim())}
async function load(){const response=await fetch("/api/spotify/config"),data=await response.json(),automation=data.sceneAutomation||{},ann=data.announcements||{};$("client-id").value=data.clientId||"";$("client-secret").value="";$("client-secret").placeholder=data.hasClientSecret?"Saved - leave blank to keep":"Enter the Spotify client secret";$("redirect-uri").value=data.redirectUri||"";$("playlist").value=data.playlist||"";$("start-volume").value=data.startVolume??"";$("normal-volume").value=data.onStreamVolume??"";$("fade-seconds").value=data.fadeSeconds??"";$("device").dataset.saved=data.deviceId||"";$("auth-state").textContent=data.hasRefreshToken?"Spotify authorization is saved.":"Spotify still needs authorization.";$("enabled").checked=Boolean(automation.enabled);$("bindings").replaceChildren();for(const row of automation.bindings||[])add(row);if(!automation.bindings?.length)add();$("song-command").checked=Boolean(ann.songCommandEnabled);$("playlist-command").checked=Boolean(ann.playlistCommandEnabled);$("now-playing").checked=Boolean(ann.nowPlayingEnabled)}
async function refreshDevices(){try{const response=await fetch("/spotify/devices"),data=await response.json();if(!response.ok)throw new Error(data.error||"Device lookup failed");const saved=$("device").value||$("device").dataset.saved||"";$("device").replaceChildren(new Option("Use the active device",""),...(data.devices||[]).map(device=>new Option(device.name+(device.is_active?" (active)":""),device.id)));$("device").value=saved;feedback((data.devices||[]).length+" Spotify device(s) found.")}catch(error){feedback(error.message,true)}}
$("add").onclick=()=>add();$("authorize").onclick=()=>window.open("/spotify/login","_blank");$("devices").onclick=refreshDevices;$("save").onclick=async()=>{try{const response=await fetch("/api/spotify/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clientId:$("client-id").value,clientSecret:$("client-secret").value,defaultPlaylist:$("playlist").value,defaultDeviceId:$("device").value,defaultStartVolume:$("start-volume").value,defaultOnStreamVolume:$("normal-volume").value,defaultFadeSeconds:$("fade-seconds").value,enabled:$("enabled").checked,bindings:rows(),songCommandEnabled:$("song-command").checked,playlistCommandEnabled:$("playlist-command").checked,nowPlayingEnabled:$("now-playing").checked})}),data=await response.json();if(!response.ok)throw new Error(data.error||"Save failed");$("client-secret").value="";$("client-secret").placeholder="Saved - leave blank to keep";feedback("Spotify settings saved.")}catch(error){feedback(error.message,true)}};
$("test-current").onclick=async()=>{try{const response=await fetch("/api/spotify/current"),data=await response.json();if(!response.ok)throw new Error(data.error||"Lookup failed");feedback(data.songText+(data.playlist?" - "+data.playlist:""))}catch(error){feedback(error.message,true)}};load().catch(error=>feedback(error.message,true));
</script></main></body></html>
