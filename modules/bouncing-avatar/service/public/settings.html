<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bouncing Avatar</title><link rel="stylesheet" href="/settings.css"></head><body><main><h1>Bouncing Avatar</h1><p>Uses your existing combined overlay. Choose scenes in Overlay Visibility.</p><form id="settings"><label class="check"><input id="enabled" type="checkbox"> Enable avatar</label><label for="image">Image</label><select id="image"><option value="">No image</option></select><div class="preview"><img id="preview" alt="Selected avatar preview" hidden></div><label class="check"><input id="colour" type="checkbox"> Change colour on bounce</label><div class="buttons"><button id="save" type="submit" disabled>Save</button><button id="reload" type="button">Discard and reload</button></div></form><details id="library"><summary>Image library</summary><p>PNG, JPEG, GIF or WebP, up to 8 MiB. Uploading selects a draft; Save applies it.</p><label for="upload">Upload an image</label><input id="upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp"><button id="remove" type="button" disabled>Remove selected image from library</button><p>To remove the saved image, first save another image or clear the selection.</p></details><p id="status" role="status" aria-live="polite">Loading settings…</p></main><script src="/settings.js"></script></body></html>
